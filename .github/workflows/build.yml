# Build noswoosh on macOS: the binary, and noswoosh.app ad-hoc signed and
# sealed. Runs on every push to main and on demand, so only reviewed code:
# upstream changes reach main through pull requests you merge
# (upstream-sync.yml), and nothing builds them before that.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build runs the repository's scripts: a read-only token and no stored
# credentials.
permissions:
  contents: read

defaults:
  run:
    shell: bash  # -eo pipefail

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          # Upstream's script compiles the sources itself, so the build follows
          # upstream's layout: noswoosh.swift today, Sources/*.swift on its
          # menu-bar-item branch.
          ./scripts/make-app-bundle.sh --out build
          cp build/noswoosh.app/Contents/MacOS/noswoosh noswoosh
          ./noswoosh version
          # Without a signing identity the script leaves the bundle unsealed,
          # which codesign rejects; seal it with an ad-hoc signature.
          codesign --force --sign - build/noswoosh.app
          codesign --verify --strict --verbose=2 build/noswoosh.app

      - name: Package
        run: |
          ditto -c -k --keepParent build/noswoosh.app noswoosh.app.zip
          {
            echo '```'
            ./noswoosh version
            shasum -a 256 noswoosh noswoosh.app.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noswoosh
          path: |
            noswoosh
            noswoosh.app.zip
